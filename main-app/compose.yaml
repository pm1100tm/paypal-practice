# ==========================================================================
# ShopSWD 로컬 실행 (MySQL + App)
#   docker compose up -d --build
#
# - MySQL 볼륨이 처음 만들어질 때 스키마(01-schema.sql)와 기본 데이터(02-data.sql)가 들어간다.
# - 기본 데이터를 다시 넣으려면: docker compose down -v && docker compose up -d --build
# - PayPal 키 등은 같은 디렉터리의 .env 에서 읽는다 (.env.template 참고, 커밋 금지)
# ==========================================================================
name: shopswd

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopswd}
      MYSQL_USER: ${MYSQL_USER:-shopswd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopswd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 초기화 중에는 TCP 를 열지 않으므로 127.0.0.1 로 확인 → 초기 데이터 적재 완료 후에만 healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

