# ==========================================================================
# shopswd-app : 비회원 장바구니 → 체크아웃 → PayPal 결제
#  - 민감정보(PayPal 키 등)는 이 파일에 쓰지 않고 환경변수로만 주입한다. (.env.template 참고)
# ==========================================================================
spring.application.name=shopswd-app
server.port=${APP_PORT:8080}

# --------------------------------------------------------------------------
# Datasource — 기본값은 docker compose 로 띄운 로컬 MySQL (localhost:3306/shopswd)
#   - 스키마/기본 데이터는 MySQL 컨테이너 최초 기동 시 들어간다 (docker/mysql/init, db/data.sql)
#   - 앱은 스키마를 만들지 않고 검증만 한다 (validate). 엔티티 변경 시 01-schema.sql 도 함께 수정
#   - 다른 DB 를 쓰려면 RDB_URL / RDB_USER / RDB_PASSWORD 로 덮어쓴다
#   - H2 는 테스트 전용 (src/test/resources/application-test.properties)
# --------------------------------------------------------------------------
spring.datasource.url=${RDB_URL:jdbc:mysql://localhost:3306/shopswd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${RDB_USER:shopswd}
spring.datasource.password=${RDB_PASSWORD:shopswd}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=${SQL_INIT_MODE:never}

# --------------------------------------------------------------------------
# Frontend / CORS
# --------------------------------------------------------------------------
app.frontend-url=${MAIN_MOBILE_PUBLIC_ENDPOINT:http://localhost:3000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:${app.frontend-url},http://localhost:*}

# --------------------------------------------------------------------------
# PayPal (키는 환경변수로만 주입)
# --------------------------------------------------------------------------
payment.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
payment.paypal.client-id=${PAYPAL_CLIENT_ID:}
payment.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
payment.paypal.brand-name=${PAYPAL_BRAND_NAME:ShopSWD}
payment.paypal.return-url=${app.frontend-url}/order/checkout
payment.paypal.cancel-url=${app.frontend-url}/cart
payment.paypal.connect-timeout=5s
payment.paypal.read-timeout=20s

# --------------------------------------------------------------------------
# Checkout 정책 (USD)
# --------------------------------------------------------------------------
checkout.shipping.flat-fee=${CHECKOUT_SHIPPING_FLAT_FEE:0.00}
checkout.shipping.free-threshold=${CHECKOUT_SHIPPING_FREE_THRESHOLD:}

# --------------------------------------------------------------------------
# Observability / Docs
# --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
