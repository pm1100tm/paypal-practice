# ==========================================================================
# 테스트 전용 (profile: test) — H2 인메모리 + 기본 데이터
#  - 로컬 MySQL 없이 @SpringBootTest 를 실행하기 위함
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:shopswd-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql

# 테스트에서 PayPal 은 Mock — 실제 키를 사용하지 않는다
payment.paypal.client-id=
payment.paypal.client-secret=
